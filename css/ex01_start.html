<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* head태그 안에 style태그 생성
           선택자 {
                속성 : 값; 
           }
        */
        h1 {
            color:red;
            background-color: aquamarine;
        }

        h2 {
            color: orange;
            background-color: dodgerblue;
        }
        
        p {
            color:blue;
            background-color: cadetblue;
        }

        span {
            color:aqua;
        }

        h3 {
            color: black;
        }
    </style>
</head>
<body>
    <h1>빨강</h1>
    <h2>주황</h2>
    <p>안녕하세요</p>
    <span>AAAAAAAAAAA</span>
    <h3>BBBBBBBBBBB</h3>
    
</body>
</html>
