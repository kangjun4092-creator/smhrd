<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            /* 
                font-size : 폰트크기
                font-weight : 폰트굵기 / 700(bold) / 100~900
                font-family : 폰트종류변경
            */
            font-size: 50px;
            font-weight: 700;
            font-family: 'YeogiOttaeJalnan';
        }

            /* Alt + Shift + F : 코드 자동 정렬*/
        @font-face {
            font-family: 'YeogiOttaeJalnan';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }
    </style>
</head>

<body>
    <p>이번 파일에서는 폰트에 관련된 내용을 적용</p>
</body>

</html>
