<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex06</title>
    <style>
        /* 
            공간분할 태그 : div
            div(division) : 블록(block)요소로 가로 전체 공간을 점유
                            크기 조절이 가능 , 웹페이지에서 영역을 구분할 때 사용(레이아웃)
        */

        /* 
        display : 요소가 눈에 보이는 방식을 지정
          - block : 가로 한 줄 영역을 차지하는 방식 (크기/여백 조절 가능)
          - inline : 컨텐츠 영역 만큼만 차지 (크기/여백 조절 불가능)
          - inline-block : inline처럼 컨텐츠 영역만 차지 (크기/여백 조절 가능)
          - none : 눈에 보이지 않도록 변경
        */

        div {
            background-color: lightgray;
            border: 1px solid red;
        }

        p {
            background-color: pink;
            display: inline-block;
        }

        span {
            background-color: lightskyblue;
            display: block;
        }
    </style>
</head>
<body>
    <div>
        <p>p 태그</p>
        <p>p 태그</p>
        <p>p 태그</p><p>p 태그</p>

        <span>span 태그</span>
        <span>span 태그</span>
        <span>span 태그</span>
    </div>
</body>
</html>
