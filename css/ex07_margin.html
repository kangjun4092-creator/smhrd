<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex07</title>
    
    <style>
        /* 
            margin : 요소의 테두리(border) 바깥의 여백
            - margin : 10px;  (모든 방향에 10px 여백)
            - margin : 10px 15px; (상,하는 10px  좌우는 15px) (top, bottom / left, right)
            - margin : 10px 15px 20px; (상 10px, 좌우 15px, 하 20px)(top / left,right / bottom)
            - margin : 10px 15px 20px 25px; (시계방향) (상 10px, 우 15px, 하 20px, 좌 25px)
            - margin-top , margin-bottom , margin-left , margin-right (각각 지정)
            - margin : auto;  : 부모요소의 중앙에 위치
        */

        div {
            width: 100px;
            height: 100px;
        }

        #box1 {
            background-color: red;
        }

        #box2 {
            background-color: green;
            margin-left: 100px;
            margin-top: 100px;
        }

        #box3 {
            background-color: lightblue;
            margin-left: 200px;
            margin-bottom: 200px;
        }

        #box4 {
            background-color: yellow;
            margin-left: 300px;
        }
    </style>
</head>
<body>
    <div id="box1"></div>
    <div id="box2"></div>
    <div id="box3"></div>
    <div id="box4"></div>
</body>
</html>
