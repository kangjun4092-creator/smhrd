<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex08</title>
    <style>
      /* 
        padding : 요소의 테두리 내부에 여백을 주는 속성
          (content와 border사이의 여백)
          ※ 사용법은 margin과 동일 (auto는 없다)
      */
      div {
        width: 100px;
        height: 100px;
      }

      #box1 {
        background-color: pink;
      }

      #box2 {
        background-color: lightblue;
        padding: 20px;
        border: 2px solid red;
      }

      #box3 {
        background-color: lightgreen;
        padding-left: 100px;
      }

      #box4 {
        background-color: lightgray;
      }

    </style>
</head>
<body>
    <div id="box1">1</div>
    <div id="box2">padding</div>
    <div id="box3">padding-left</div>
    <div id="box4">4</div>
</body>
</html>
