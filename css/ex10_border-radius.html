<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex10</title>
  <style>
        /* 
          border-radius : 요소의 모서리를 둥글게 하는 속성
            > border-top-left-radius : 왼쪽 위 설정
            > border-bottom-right-radius : 왼쪽 아래 설정
         */
    div {
      width: 100px;
      height: 100px;
      background-color: green;
      /* border-radius: 20px; */
      
      /* border-top-left-radius: 50px; */
      /* border-bottom-right-radius: 50px; */

      /* 원형 만들기 */
      border-radius: 50%;
    }

    input {
      border-radius: 10px;
    }
  </style>
</head>
<body>
    <div></div>
    <input type="text" placeholder="내용을 입력해주세요.">
</body>
</html>
