<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex12</title>
  <style>
    /* 
      position: absolute;
        - 요소를 문서 흐름에서 제거.
        - 부모 혹은 body를 기준으로 절대 좌표 이동
        - 부모요소가 static 인 경우에는 상위 요소가 기준점
        - 부모요소가 static 이 아닌 경우에는 부모 요소가 기준점
        - 부모의 상위 요소도 static 일 경우에는 계속 기준점 올라감

        ※ 보통 레이아웃을 해치지 않고, absoulte를 사용하기 위해서는
           부모의 position을 realative로 변경 하면 된다
      
      position: sticky;
        - 요소가 문서 흐름에 따라 스크롤 되다가, 지정한 위치에 도달하면
          화면에 고정됨
        - 고정 기준은 가장 가까운 스크롤 가능한 조상 요소의 영역
        - 부모 요소의 position에 무관하게 부모요소를 벗어나지 못함
        - top, left, right, bottom 중에 하나 이상이 설정되어야 함

      position: fixed;
        - 요소를 문서 흐름에서 제거.
        - 화면을 기준으로 고정된 위치에 배치
        - 스크롤을 하여도 항상 같은 화면 위치에 배치(브라우저 기준)
        - 
    */
    #parent {
      width: 100px;
      height: 300px;
      background-color: lightgray;

      position: relative;
      /* position: relative 기준점을 잡아줌 */
    }

    .child {
      width: 100px;
      height: 100px;
    }

    .red {
      background-color: red;
      position: absolute;
      /* position: absolute  => 부모가 relative 일 경우 부모를 기준으로 잡고 값이 없을 경우에 최상단 body로 기준을 잡음 */
      left: 10px;
      top: 10px;
      z-index: -1;
    }

    .yellow {
      background-color: yellow;
      position: sticky;
      top: 0;
      /* position: sticky;  => 부모의 영역까지 스크롤 내렸을때 고정 */
     
    }

    .blue {
      background-color: blue;
      position: fixed;
      bottom: 20px;
      right: 20px;
      border-radius: 50%;
      /* position: fixed;  => 보여지는 화면에 고정 */
    
    }

  </style>
</head>
<body>
  <div id="parent">
    <div class="child red"></div>
    <div class="child yellow"></div>
    <div class="child blue"></div> 
  </div>

  <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
