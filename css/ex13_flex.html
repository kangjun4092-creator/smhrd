<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex13</title>
  <style>
    /* 
      display : flex
        - 레이아웃 배치 전용 기능
        - container : 부모 요소로 flex의 영향을 받는 전체 공간
        - item : 설정된 flex 속성에 따라 배치되는 자식 요소

      1. flex container 속성
        
          flex-direction : 아이템이 배치되는 축의 방향 설정
          :row(기본값), row-reverse, column, column-reverse
        
          flex-wrap : 아이템의 줄바꿈을 결정
          : nowrap(기본값), wrap, wrap-reverse
        
          justify-content : 메인축 방향 아이템 정렬
          : flex-start(기본값), center, flex-end,
            space-between, space-evenly, space-around
        
          align-items : 교차축 방향 아이템 정렬
          : stretch(기본값), flex-start, center, flex-end,
            baseline
          
          ※ flex 전용 속성은 아님=> gap: n;   : n만큼 flex item들의 사이 간격을 떨어뜨린다.

      2. flex item 속성
      
          flex-grow : container의 남은 공간을 n의 비율로 분배(기본값 : 0)

          flex-shirink : container의 공간이 부족할 때, 줄어드는 비율(기본값 : 1)

          flex-basis : item의 메인축 방향 기본 크기 설정(기본값 : auto)

          flex : grow, shirink, basis를 한번에 설정 (순서 중요)
    */
    
    #container {
      /* height: 200px; */
      background-color: lightgreen;
      display: flex;
      /* display: flex;  => 기본 가로방향 정렬 (display: flex; 사용안할시에 margin 상쇄효과가 발생함) */
      flex-direction: row;
      /* flex-direction: column;  => 기준으로 새로방향 정렬
                      
      */
      flex-wrap: nowrap;
      /* flex-wrap: nowrap;  => 기본값
                    
      */
    
      justify-content: flex-start;
      /* justify-content: flex-start;  => 정렬방식 flex-start가 기본값 */
      align-items: stretch;
      /* align-items: center; 교차축 기준strech 가 기본값 */
      /* gap : 10px; */
    }
    
    .item:nth-child(2) {
      font-size: 16px;
      /* flex-grow: 2; */
      /* flex-shrink: 0; */
      /* flex: 2 1 100px; */
    }

    .item {
      /* width: 100px; */
      background-color: skyblue;
      border: 1px solid black;
      /* margin: 20px; */
      /* flex는 margin 상쇄 효과가 발생하지 않는다 */
      /* flex-basis: 100px; */
      /* flex-grow: 1; */
      flex: 2 1 100px;
    }

  </style>
</head>
<body>
  <div id="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
  </div>
</body>
</html>
