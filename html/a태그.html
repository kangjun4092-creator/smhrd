<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aTAG</title>
</head>
<body>
    <!-- a태그(anchor) : 필수속성(href)
        현재 문서에서 다른 문서로 즉시 접근
        target : blank(새로운 페이지에서 변환)
               : self(현재 페이지에서 변환)
    -->
    <a href="https://www.naver.com" target="_self" id="ttop">네이버로 이동</a>

    <a href="./document/이미지.html" target="_blank" id="img">
        <img src="./img/imggggg.jpg">
    </a>

    <h1 id="top">상단</h1>
    <!-- br -> 30개
        원하는 태그이름 * 갯수 ( p*30 ) ( ul>li*3>a )    
    -->
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <a href="#top">상단으로 이동</a>
</body>
</html>
