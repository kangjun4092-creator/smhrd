<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img</title>
</head>
<body>
    <!-- 이미지 태그 : 필수속성(src)-->

    <!-- 절대경로, 상대경로
        절대경로 : 파일의 위치를 루트 디렉토리(최상위에서)부터 시작하여 전체경로를 나타냄
        상대경로 : 현재 작업 중인 디렉토리(현재 위치)를 기준으로 경로를 나타냄
    -->

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzvuaEw6bGCxlefQDQJ13xe6qNS0v0-rr0IA&s">
    
    <!-- 
        ../ : 현재위치를 기준으로 상위폴더를 접근
        ./  : 현재위치를 기준으로 파일/폴더 접근
        /   : 최상위로 접근
    -->
    <img src="../img/imggggg.jpg">
</body>
</html>
