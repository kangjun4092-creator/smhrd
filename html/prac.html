<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html1</title>
</head>
<body>
    저의 첫 웹페이지입니다.
    <!--
     주석 단축키 : ctrl + /
     문서 형식 불러오기 : !  ->  Enter
     Live Server 실행 : 마우스 우클릭 -> Open With LiveServer 클릭 (단축키 : alt + L + O)
    -->
    
    <!-- 1. 제목 태그(h1 ~ h6) -->
    <h1>제목태그</h1>
    <h2>제목태그</h2>
    <hr>

    <!-- 2. 본문 태그(p , span)
        p 태그 : 단락으로 표현이 되기 때문에 가로 `한줄영역` 전부 차지 > 개행이 된 것 처럼 보임
        span 태그 : 문장으로 표현이 되기 때문에 `입력한만큼` 영역차지 > 가로로 이어서 배치
    
    -->
   
    <p>본문태그</p>
    <p>본문태그2</p>
    <span>본문태그3</span>
    <br>  
    <span>본문태그4</span>
  
    <!-- hr / br 태그
     hr : 수평선을 그어주는 태그
     br : 개행 태그
    -->

    <!-- 요소를 변경하기 위해 속성을 사용.
        사용방법 : 속성(align)=값(center)
        속성="값" 띄어쓰기로 복수개 입력 가능.
    -->
   
    <p align="center">중앙으로 이동</p>
    <hr color="red" width="150" size="140">
    <hr color="orange" width="150" size="120">
    <hr color="yellow" width="150" size="100">
    <hr color="green" width="150" size="80">
    <hr color="blue" width="150" size="60">
    <hr color="navy" width="150" size="40">
    <hr color="purple" width="150" size="20">

    <!-- 코드 그대로 복사하기 : (요소 맨 뒤에 커서) 
        alt+shift 방향키 아래
        다중 커서 지정 : alt + 원하는 위치 마우스 클릭
        다중 블록 지정 : ctrl + D  (순차적으로 블록됨) -->
</body>
</html>
