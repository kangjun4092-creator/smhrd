<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강조태그</title>
</head>
<body>
    <!-- 강조태그 
        (1) b태그 : 시각적 의미의 강조
        (2) strong태그 : 실질적 의미의 강조
        (3) mark태그 : 배경색 적용(기본값 노란색)
        (4) sup, sub태그 : 위첨자, 아래첨자        
    -->
    <span>본문내용 확인</span>
    <b>강조내용 확인</b>
    <br>

    <b>공지사항</b>
    <span>입실시 qr체크 확인</span>
     
    <br>
    <span>이 좌석은</span>
    <strong>노약자만</strong>
    <span>이용가능합니다.</span>
    
    <br>
    <span>여기 부분에</span>
    <mark>강조를 하겠습니다</mark>
    
    <p>
        이번 강조내용은<sup>위첨자</sup>
    </p>

    <p>
        두번째 강조내용은<sub>아래첨자</sub>
    </p>


</body>
</html>
