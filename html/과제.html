<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="#" method="get">
        <table border="1">
            <tr bgcolor="gray">
                <th colspan="3" height="50">Step 1 : 아이디/ 비번 입력</th>
            </tr>
            <tr  height="40">
                <td align="center">아이디</td>
                <td>
                    <input>
                </td>
            </tr>
            <tr height="40">
                <td align="center">비밀번호</td>
                <td>
                    <input>
                </td>
            </tr>
            <tr height="40">
                <td align="center">비밀번호 확인</td>
                <td>
                    <input>
                </td>
            </tr>
            <tr bgcolor="gray">
                <th colspan="3" height="50" >Step 2 : 개인정보</th>
                
            </tr>
            <tr height="40">
                <td align="center">성별</td>
                <td>
                    남<input
                    type="radio"
                    name="gender"
                    value="man"
                    >
                    여<input
                    type="radio"
                    name="gender"
                    value="woman"
                    >
                </td>
            </tr>
            <tr height="40">
                <td align="center">혈액형</td>
                <td>
                    <select>
                        <option>A형</option>
                        <option>B형</option>
                        <option>O형</option>
                        <option>AB형</option>
                    </select>
                </td>
            </tr>
            <tr height="40">
                <td align="center">생일</td>
                <td>
                    <input
                    type="date"
                    >
                </td>
            </tr>
            <tr bgcolor="gray">
                <th colspan="3" height="50">Step 3 : 선호도</th>
                
            </tr>
            <tr height="40">
                <td align="center">취미</td>
                <td>
                    축구<input
                    type="checkbox"
                    >
                    야구<input
                    type="checkbox"
                    >
                    농구<input
                    type="checkbox"
                    >
                </td>
            </tr>
            <tr height="40">
                <td align="center">좋아하는 색깔</td>
                <td>
                    <input
                    type="color"
                    >
                </td>
            </tr>
            <tr bgcolor="gray">
                <th colspan="3" height="50">Step 4 : 하고싶은 말</th>

            </tr>
            <tr>
                <td colspan="3">
                    <textarea cols="50" rows="5"></textarea>
                </td>

            </tr>
            <tr>
                <td colspan="3" align="center">
                    <input type="submit">
                    <input type="reset">
                </td>

            </tr>
        </table>
    </form>
</body>

</html>
