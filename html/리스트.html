<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>
<body>
    <!-- 리스트 태그 : ul, ol
        ul, ol : 두 태그 모두 li태그가 필요
        li : 리스트 내 실질적인 데이터 
    -->

    <!-- (1) ul : 정돈되지않은 리스트(순번이 없음)
            type 속성 : disc(기본 값), circle(빈 원형), square(사각형)    
    -->
    <ul type="disc">
        <li>html</li>
        <li>css</li>
    </ul>

    <!-- (2) ol : 정돈된 리스트
            type 속성 : 1(기본값), A, a, I, i 
    -->
    <!-- Ctrl + Space : 자동입력 창 생성 -->
    <ol type="I">
        <li>등원하기</li>
        <li>QR찍기</li>
        <li>수업듣기</li>
    </ol>

    <!-- 사고싶은 물건 , 등원하는 방법 두개를 리스트 형태로 만들기 -->
    <strong>사고싶은 물건</strong>
    <ul>
        <li>축구화</li>
        <li>유니폼</li>
    </ul>

    <strong>등원하는 방법</strong>
    <ol>
        <li>샤워하기</li>
        <li>운전하기</li>
        <li>QR찍고 수업듣기</li>
    </ol>
    
</body>
</html>
