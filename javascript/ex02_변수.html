<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 변수 선언 & 초기화 방법
    // - 변수 선언 -> let 변수명;
    // - 변수 초기화(할당) -> let 변수명 = 값; or 변수명 = 값;
    // - 변수 선언 키워드 : var, let
    var number = 5;  // number 변수에 5를 저장하겠다!
    var number = 3;  // 재선언&재할당 모두 가능



    
    console.log(number);
    
    let number2 = 5;  // 재선언 X ,   재할당은 가능
    number2 = 3;

    console.log(number2);
    
    const number3 = 5; 
    // number3 = 3;   // 상수는 재선언 X  재할당 X

    console.log(number3);
    
    let name =  prompt("이름을 입력해주세요~!");
    console.log("반갑습니다~ "+ name + "님! 즐거운 하루 되세요!");
    
    


  </script>




</body>
</html>
