<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 자료형 
    // 1. 기본 자료형 : 문자열, 숫자형(정수,실수 포함), 논리형
    let message = "hello JS!";
    let message2 = 'hello JS!';
    console.log(typeof message, message2);

    let number = 5;
    let number2 = 3.4;
    console.log(typeof number, typeof number2);

    let isEmpty = true;
    console.log(typeof isEmpty);
    
    // 2. 참조 자료형 : 배열, 객체
    let array = [1,2,3];
    console.log(typeof array);

    let object = {name : "jun", age:2 , gender:true};
    console.log(typeof object);
    
    
    // 3. 특수 자료형 : null, undefined
    // null: 빈 값을 의미 자료형은 Object로 인식
    // undefined : 빈 값을 의미, 자료형이 없는 상태
    let empty = null;    // 추후 비어있는 변수를 사용해야할경우 'null' 입력해놓기!
    console.log(typeof empty);

    let data;
    console.log(typeof data);

    // 형변환
    // 1. 숫자형으로 변환
    console.log("5",Number("5"));  // 문자열 "5" -> 숫자 5로 변환
    console.log("5.3",parseInt("5.3"));  // 정수로 변환 "5.3" -> 5
    console.log("5.3",parseFloat("5.3"));  // 실수로 변환 "5.3" -> 5.3
  
    // 2. 문자열로 변환
    let n = 5;
    let n2 = 5.123;
    console.log(5, String(5)); // 5 -> '5'
    console.log(n, n.toString());  // 5 -> '5'
    console.log(n2, n2.toFixed(1));  // 5.123 -> '5.1'
    
    // 실습)
    let inputNum1 = Number(prompt("첫 번째 숫자를 입력하세요"));
    let inputNum2 = prompt("두 번째 숫자를 입력하세요");

    
    console.log("두 숫자를 더한 결과: ", inputNum1 + Number(inputNum2));
    





    </script>

</body>
</html>
