<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 조건문 문법
    // 1. 단순 if문
    if(true){
      console.log("단순 if문 실행!");
      
    }

    // 2. if~else문
    if(false){
      console.log("true일때 실행");
      
    }else{
      console.log("false일때 실행");
      
    }

    // 3. 다중 if문

    if(false){
      console.log("조건1 실행");
      
    }else if(true){
      console.log("조건2 실행");
      
    }else{
      console.log("기타..");
      
    }


    // 실습

    let inputNum1 = Number(prompt("첫 번째 숫자를 입력하세요!"));
    let inputNum2 = Number(prompt("두 번째 숫자를 입력하세요!"));

    if(inputNum1 > inputNum2){
      console.log("첫 번째 입력한 값이 더 큰 수 입니다.");
      
    }else if(inputNum1 < inputNum2){
      console.log("두 번째 입력한 값이 더 큰 수 입니다.");

    }else{
      console.log("두 수는 같습니다.");
      
    }







  </script>
</body>
</html>
