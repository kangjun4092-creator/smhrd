    //      isPass() 함수 구현해보기

    // 실습) 문제 

    let inputWeight = Number(prompt("몸무게를 입력하세요(kg)"));
    let inputHeight = Number(prompt("키를 입력하세요(cm)"));

    function getBMI(weight, height){
      //BMI 계산식 : 몸무게 / (키(m) * 키(m))

      let bmi = weight / ((height/100)*(height/100));
      let message = null;

      if(bmi >= 25){
        message = "비만";
      }else if(bmi >= 23){
        message = "과체중";
      }else if(bmi >= 18.5){
        message = "정상";
      }else{
        message = "저체중";
      }

      return [bmi,message];

    }
    let resultBMI = getBMI(inputWeight, inputHeight);

    console.log(`당신의 BMI는 ${resultBMI[0].toFixed(2)}이고 ${resultBMI[1]}입니다.`);
