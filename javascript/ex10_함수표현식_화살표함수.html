<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    /*
      [함수 표현식]
      - 함수 구조를 변수에 저장하는 형태
      - 익명함수 형태로 저장하고 호이스팅이
      - 변수에 저장한 후에 호출할 수 있음
    
      const 변수명 = function(){
      실행할 로직 작성
      
      return 반환할 데이터;
      
      }
    */

    const func = function(){
      console.log("함수 표현식입니다.");
      
    }

    const func1 = function(){
      return "함수 표현식입니다!!"
    }

    func();
    console.log(func1());
    
    /*
      [화살표 함수]
      - 함수 표현식을 간소화한 형태

      const 변수명 = () => {
        실행할 로직 작성
        return 반환할 데이터;
      }

      const 변수명 = () => 반환할 데이터;
      
      const 변수명 = 매개변수 => 반환할 데이터; 

    */

    const arrowFunc = () => {
      console.log("화살표 함수입니다.");
      
    }
    arrowFunc();
 
    const arrowFunc2 = name => {
      console.log(name);
      
    }
    
    arrowFunc2("스인개");

    const arrowFunc3 = name => `${name}입니다.`;

    console.log(arrowFunc3("스인개"));
    







  </script>
</body>
</html>
