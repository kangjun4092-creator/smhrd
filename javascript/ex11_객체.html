<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 객체 구조
    // - {key : value , key : value ,.....}
    // key : 큰 따옴표로 표기 or 생략
    // value : 기본 자료형, 참조형, 함수
    // 객체 내 선언된 메소드는 속성에 접근할 때 "this.속성명" 형태로 접근해야 한다!
    // 속성명으로만 작성하면 전역변수영역에서 찾기 때문

    let person = {            // 속성 (property)
      name : "스인개",
      age : 10,
      gender : "남",
      greet : function(){     // 메소드 (method)
        console.log("안녕하세요!"+ this.age);
        
      }
      
    }

    console.log(person);
    console.log(person.name);
    person.greet();
    
    
    


  </script>
</body>
</html>
