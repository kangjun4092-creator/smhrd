<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>


  </style>
</head>
<body>
  
  <button id="btn">클릭</button>

  <!-- Js -->
  <script>
    const btn = document.querySelector("#btn");
    
    // 버튼에 클릭 이벤트 연결하기
    // - HTML요소객체.addEventListener(이벤트, 이벤트 핸들러)
    // - 이벤트 : click, mouseover, scroll 등 동작을 감지할 이벤트를 문자열로 작성
    // - 이벤트 핸들러 : 이벤트를 감지했을 때 실행하는 함수 (익명함수 or 화살표함수 or 함수명)
    
    // 익명함수로 연결
    btn.addEventListener("click", function(){
      alert("클릭이벤트 발생1!");
    });

    // 화살표함수로 연결
    btn.addEventListener("click", ()=>{
      alert("클릭이벤트 발생2!");
    });

    // 함수명으로 연결
    const func = () => {
      alert("클릭이벤트 발생3");
    }
     
    // 함수호출을 할 때에는 소괄호를 붙이는 게 맞지만,
    // 함수를 연결할 때에는 소괄호를 생략해야 한다.
    // why? 자바스크립트엔진에서 소괄호를 만나면 함수를 실행한다는 의미로 해석
    // 활용)
    // - 함수 내 구현할 로직의 양이 많을 경우 별도로 함수를 선언해서 연결
    // - 로직을 별도로 관리할 경우 
    btn.addEventListener("click", func);  

    


  </script>

</body>
</html>
