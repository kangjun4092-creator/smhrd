<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행운의 숫자 뽑기</title>
 
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
            font-family: Arial, "Noto Sans KR", sans-serif;
            color: #222;
        }
        .app {
            width: min(92%, 560px);
            padding: 32px;
            background: #fff;
            border: 1px solid #d9dde3;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h1 { margin-top: 0; }
        .description {
            margin-bottom: 24px;
            color: #555;
            line-height: 1.6;
        }
        button, input, select {
            padding: 12px 16px;
            margin: 6px;
            border: 1px solid #aeb6c2;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            cursor: pointer;
            background: #222;
            color: #fff;
        }
        button:hover { opacity: 0.85; }
        .result {
            min-height: 52px;
            margin-top: 20px;
            padding: 14px;
            background: #f0f2f5;
            border-radius: 8px;
            font-size: 20px;
            line-height: 1.5;
        }
    </style>

</head>
<body>

<div class="app">
    <h1>행운의 숫자 뽑기</h1>
    <p class="description">버튼을 눌러 오늘의 행운 숫자를 확인하세요.</p>
    <button id="drawButton">숫자 뽑기</button>
    <div id="result" class="result">결과가 여기에 표시됩니다.</div>
</div>


<script>
    /*
        [문제 정의]
        버튼을 클릭하면 1부터 100 사이의 무작위 숫자를 화면에 출력하는 프로그램을 만드시오.

        [구현 조건]
        1. 버튼 클릭 이벤트를 사용한다.
        2. Math.random()과 Math.floor()를 사용하여 1~100 사이의 정수를 만든다.
        3. 결과는 alert()가 아니라 웹페이지의 결과 영역에 출력한다.
        4. 버튼을 다시 누르면 새로운 숫자가 출력되어야 한다.
    */
    // 필요한 HTML 요소 정보를 가져온다.
    const drawBtn = document.querySelector("#drawButton");
    const result = document.querySelector("#result");

    // drawBtn 에 클릭이벤트 연결하기
    // drawBtn.addEventListener("click", function(){

    //   // 1~100 사이의 정수 생성하기 (Math.random() * 100)  0 ~ 99 까지    밖에 +1로   1~ 100까지
    //   let randomNum = Math.floor(Math.random() * 100) + 1;


    //   // 생성한 숫자를 화면에 출력하기
    //   result.textContent = `오늘의 행운 숫자는 ${randomNum}입니다.`;

    // });

    
    //draw 함수로 분리해서 이벤트 연결
    const draw = function(){
      let randomNum = Math.floor(Math.random() * 100) + 1;
      result.textContent = `오늘의 행운 숫자는 ${randomNum}입니다.`;
    };
      
    drawBtn.addEventListener("click", draw);


        



 


</script>
</body>
</html>
